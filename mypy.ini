# mypy — strict typing, zero errors enforced project-wide.
# Historical debt fully eliminated; baseline ratchet retired.

[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
ignore_missing_imports = True
# strict_optional disabled — too many Optional false-positives in legacy code
strict_optional = False
check_untyped_defs = True
# disallow_untyped_defs disabled — gradual; enable per-module when ready
disallow_untyped_defs = False
no_implicit_optional = True
show_error_codes = True
files = services/,main.py,config.py,logging_config.py
