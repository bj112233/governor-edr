# Pre-commit hooks — run lint-gate + ruff format before every commit.
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: lint-gate
        name: Lint Gate (xenon + import-linter + vulture + mypy + bandit + gitleaks + file-length)
        entry: ./.venv/Scripts/python.exe bin/lint-gate.py --fast
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: gitleaks
        name: Secret Scan (gitleaks, public rules)
        entry: gitleaks detect --no-git --source . --config .gitleaks.toml
        language: system
        pass_filenames: false
        stages: [pre-commit]
        # PII rules (.gitleaks-local.toml) run inside lint-gate.py which
        # loads both configs when the local file exists.
