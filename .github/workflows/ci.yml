name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  static-analysis:
    name: Static Analysis Gate
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies (frozen lock)
        run: uv sync --frozen

      - name: Install gitleaks
        run: |
          choco install gitleaks -y --no-progress
          gitleaks version

      - name: Full Lint Gate
        env:
          PYTHONIOENCODING: utf-8
        run: uv run python bin/lint-gate.py --fast

  test:
    name: Test Suite
    needs: static-analysis
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies (frozen lock)
        run: uv sync --frozen

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: uv run python -m pytest tests/ -v --tb=short --timeout=30 -x
