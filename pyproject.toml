# ── Sentinel — packaging & dependency manifest ──────────────────────────────
# Source of truth for runtime + dev dependencies. `uv.lock` pins exact versions;
# `requirements.txt` is an auto-generated artifact (do not edit) exported via
# `uv export --format requirements-txt --output requirements.txt` for fallback
# `pip install` in environments without uv. A lint-gate check
# (bin/lock_sync_check.py) fails the build if requirements.txt drifts from
# uv.lock.
#
# Pinning policy: wide lower bounds here, exact pins come from uv.lock.
# Manual upper bounds ONLY where a major bump is known to break the API:
#   - aiogram>=3.29,<4   (aiogram 4 is a breaking rewrite)
#   - pydantic<2.13      (existing guard, 2.13 changed validator behavior)

[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel — asynchronous OSINT/forensics Telegram bot (Edge AI, local LLM)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
# Sentinel is an application, not a distributable library — no PyPI publish.
# uv treats a [project] without [build-system] as virtual (no self-build).
# `package = false` makes that explicit (see [tool.uv]).

dependencies = [
    # ── Telegram / async runtime ───────────────────────────────────────────
    "aiogram>=3.29,<4",          # upper bound: aiogram 4 breaks the API
    "aiofiles>=25.1.0",
    "aiohappyeyeballs>=2.6.1",
    "aiohttp>=3.14.1",
    "aiosignal>=1.4.0",
