[dependency-groups]
# Dev / CI tooling — NOT installed in production. uv installs these via
# `uv sync` (default includes all groups); production uses
# `uv sync --no-group dev` or the exported runtime-only requirements.
dev = [
    # ── Static analysis (CI gate) ──────────────────────────────────────────
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "import-linter>=2.11.0",
    "vulture>=2.16",
    "cognitive_complexity>=1.3.0",   # bin/cognitive_complexity_gate.py

    # ── Type checking, linting, security ───────────────────────────────────
    "setuptools>=83.0.0",            # required by several tools' metadata
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",

    # ── Test runner ────────────────────────────────────────────────────────
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.1",
]

# ── uv configuration ─────────────────────────────────────────────────────────
[tool.uv]
# Sentinel is an application, not a distributable package — do not build/install
# the project itself, only its dependencies.
package = false

# TEMPORARY (packaging migration): exact pins carried over from the legacy
# requirements.txt to guarantee zero version drift in commit 1. The
# [project.dependencies] above use wide `>=` bounds (policy); these constraints
# pin the resolver to the previously-committed exact versions so `uv sync
# --frozen` reproduces the pre-migration venv bit-for-bit.
#
