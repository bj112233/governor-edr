# ── Import Linter: Architectural Coupling ────────────────────────────────────
# Enforces layer separation: infrastructure must not import UI/agent layers.
# Telegram is the UI layer — it may import agent, but agent must not import
# telegram. Memory is infrastructure — must not import agent or telegram.
# Migrated from setup.cfg; lint-gate.py reads this via config_filename="pyproject.toml".
[tool.importlinter]
root_packages = [
    "services",
    "skills",
]

[[tool.importlinter.contracts]]
name = "DB pool must not import UI or agent layers"
type = "forbidden"
source_modules = [
    "services.db_pool",
]
forbidden_modules = [
    "services.agent",
    "services.telegram",
    "services.llm_bridge",
    "services.local_mcp_server",
]

[[tool.importlinter.contracts]]
name = "Memory layer must not import agent or telegram"
type = "forbidden"
source_modules = [
    "services.bot_memory",
    "services.memory_store",
    "services.memory_db",
    "services.error_memory",
    "services.osint_memory",
]
forbidden_modules = [
    "services.agent",
    "services.telegram",
]

[[tool.importlinter.contracts]]
# TODO: Re-enable agent-no-telegram-ui contract after decoupling
# telegram_channel from services.telegram.__init__ (which re-exports all UI
# modules). Currently tools.mcp_handlers → telegram_channel → telegram.__init__
# creates transitive agent→telegram UI coupling via tools_registry.
# Fix: extract a messaging interface from telegram_channel that doesn't pull
# in the full telegram package.
name = "Agent layer must not import telegram UI (handlers/callbacks/channel)"
type = "forbidden"
source_modules = [
    "services.agent",
    "services.tools",
]
forbidden_modules = [
    "services.telegram.handlers",
    "services.telegram.callbacks",
    "services.telegram.routing",
    "services.telegram.processing",
    "services.telegram.channel",
    "services.telegram_channel",
]

[[tool.importlinter.contracts]]
name = "Skills must not import services directly (subprocess isolation)"
type = "forbidden"
source_modules = [
    "skills",
]
forbidden_modules = [
    "services",
]
